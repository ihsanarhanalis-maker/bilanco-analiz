# Render ücretsiz Web Service — https://dashboard.render.com
# New → Blueprint → bu GitHub reposunu seç
services:
  - type: web
    name: bilanco-analiz
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: "npm ci --omit=dev"
    startCommand: "npm start"
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: OPENAI_MODEL
        value: "gpt-5.6-luna"
      - key: OPENAI_SERVICE_TIER
        value: "fast"
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: "https://bilanco-analiz-4sjg.onrender.com/"
      - key: NOTIFICATION_CRON_SECRET
        generateValue: true
      - key: NOTIFICATION_POLL_MINUTES
        value: "15"
