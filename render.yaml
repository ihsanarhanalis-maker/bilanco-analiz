# Render ücretsiz Web Service — https://dashboard.render.com
# New → Blueprint → bu GitHub reposunu seç
services:
  - type: web
    name: bilanco-analiz
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: "npm ci --omit=dev"
    startCommand: "npm start"
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: AI_API_ENABLED
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-5.6-luna"
      - key: OPENAI_SOL_MODEL
        value: "gpt-5.6-sol"
      - key: OPENAI_ASTRA_MODEL
        value: "gpt-6-astra"
      - key: OPENAI_API_KEY
        sync: false
